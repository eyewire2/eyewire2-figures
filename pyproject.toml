[project]
name = "eyewire2-figures"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adjusttext>=1.3.0",
    "cell-mosaics>=0.1.3",
    "fastparquet>=2026.5.0",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "matplotlib-scalebar>=0.9.0",
    "numpy>=2.4.6",
    "opentsne>=1.0.4",
    "pandas>=2.3.3",
    "pingouin>=0.6.1",
    "pyarrow>=24.0.0",
    "scanpy>=1.12.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "skeliner>=0.2.7",
    "pywarper>=0.2.8",
    "watermark>=2.6.0",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
]

[tool.uv.sources]
# The latest PyPI release (0.1.1) predates the Voronoi border rule and the
# soma-constrained random simulations used for the A17 mosaic figure; pin the
# commit that added them until a newer release is on PyPI.
cell-mosaics = { git = "https://github.com/berenslab/cell_mosaics", rev = "a68d4475f4fdf93f2d08e2979ef88a7e53d22b6b" }
